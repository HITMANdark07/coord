name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every project, every run: correct on the first push and on PRs. Nx caching keeps it fast locally;
      # switch to `nx affected` once CI time matters (needs nrwl/nx-set-shas and `actions: read`).
      - run: pnpm check
